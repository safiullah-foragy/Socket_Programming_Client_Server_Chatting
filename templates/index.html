<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-Server Chat Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
            <h1>💬 Result Management & University Info System</h1>
            <p>Chat with the server to manage student results and search universities</p>
        </div>
        
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message server-message">
                    <div class="message-content">
                        <strong>Server:</strong> Welcome! I can help you with student results and university information. Type <code>help</code> to see available commands.
                    </div>
                    <div class="message-time"></div>
                </div>
            </div>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                >
                <button id="sendButton">Send</button>
            </div>
        </div>
        
        <div class="quick-commands">
            <h3>Quick Commands:</h3>
            <button class="cmd-btn" onclick="setCommand('help')">📚 Help</button>
            <button class="cmd-btn" onclick="setCommand('add result: name=, result=, college=, board=')">➕ Add Result</button>
            <button class="cmd-btn" onclick="setCommand('list all')">📋 List All Students</button>
            <button class="cmd-btn" onclick="setCommand('search ')">🔍 Search Student</button>
            <button class="cmd-btn" onclick="setCommand('university list')">🎓 List Universities</button>
            <button class="cmd-btn" onclick="setCommand('university ')">🏛️ Search University</button>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
